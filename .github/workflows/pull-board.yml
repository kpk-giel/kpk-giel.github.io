name: pull-board

# Temporary mirror while external.kpk.io can't deploy (Giel, 22 Oct 2026): copies the latest board build
# from kpk-labs/btc-carry-dashboard every hour, 15 minutes after the board's own refresh at :20.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy the latest build if it is a complete page
        run: |
          set -euo pipefail
          curl -sSfL --max-time 60 --retry 2 -o /tmp/board.html https://raw.githubusercontent.com/kpk-labs/btc-carry-dashboard/main/index.html
          head -c 512 /tmp/board.html | grep -qi '<!doctype html>'
          tail -c 512 /tmp/board.html | grep -qi '</html>'
          cmp -s /tmp/board.html btc-carry-dashboard/index.html && { echo "already current"; exit 0; }
          cp /tmp/board.html btc-carry-dashboard/index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -qam "Pull latest BTC Carry board build"
          git push -q
